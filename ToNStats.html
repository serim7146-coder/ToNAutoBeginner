<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToN Statistics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');
:root {
  --bg:#080810;--surface:#0e0e1a;--surface2:#13131f;--border:#1e1e32;
  --text:#c8c8e0;--dim:#50506a;--accent:#7b5ea7;--accent2:#a07bd4;
  --gold:#c9a84c;--red:#c44;--teal:#4a9a8a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 10% 20%,rgba(123,94,167,.08) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 90% 80%,rgba(74,154,138,.05) 0%,transparent 60%);pointer-events:none;}
.container{max-width:1400px;margin:0 auto;padding:48px 24px;position:relative;}
header{text-align:center;margin-bottom:64px;}
header h1{font-family:'Cinzel',serif;font-size:clamp(28px,6vw,56px);font-weight:900;letter-spacing:.2em;color:var(--gold);text-shadow:0 0 40px rgba(201,168,76,.3);margin-bottom:8px;}
header p{font-size:12px;color:var(--dim);letter-spacing:.3em;text-transform:uppercase;}
.divider{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto;}
.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px 24px;margin-bottom:32px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.filter-bar label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);}
.filter-bar input{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Crimson Pro',serif;font-size:14px;padding:6px 12px;border-radius:2px;outline:none;width:200px;}
.filter-bar input:focus{border-color:var(--accent);}
.btn{background:var(--accent);color:#fff;border:none;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.15em;padding:8px 20px;cursor:pointer;border-radius:2px;transition:background .2s;}
.btn:hover{background:var(--accent2);}
.btn.sec{background:transparent;border:1px solid var(--border);color:var(--dim);}
.btn.sec:hover{border-color:var(--accent);color:var(--text);}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px;}
.stat-card{background:var(--surface);border:1px solid var(--border);padding:20px;border-radius:4px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--teal));}
.stat-card h3{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.25em;color:var(--dim);text-transform:uppercase;margin-bottom:8px;}
.stat-card .value{font-family:'Cinzel',serif;font-size:30px;color:var(--gold);font-weight:600;}
.stat-card .sub{font-size:12px;color:var(--dim);margin-top:4px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;}
@media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:24px;}
.panel h2{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.25em;color:var(--dim);text-transform:uppercase;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.chart-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
canvas{flex-shrink:0;}
.legend{flex:1;min-width:160px;max-height:320px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.legend-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:13px;}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.legend-name{flex:1;}
.legend-count{color:var(--dim);font-size:12px;min-width:36px;text-align:right;}
.legend-pct{color:var(--accent2);font-size:11px;min-width:42px;text-align:right;}
.bar-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;}
.bar-item{display:flex;align-items:center;gap:10px;font-size:13px;}
.bar-label{width:160px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.bar-count{width:48px;text-align:right;color:var(--dim);font-size:12px;flex-shrink:0;}
.loading{text-align:center;padding:80px;color:var(--dim);font-family:'Cinzel',serif;letter-spacing:.2em;font-size:13px;}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>TERRORS OF NOWHERE</h1>
    <div class="divider"></div>
    <p>Round Statistics Dashboard</p>
  </header>

  <div class="filter-bar">
    <label>Player Hash</label>
    <input type="number" id="playerHash" placeholder="ハッシュ値（空=全員）">
    <button class="btn" onclick="loadData()">読み込む</button>
    <button class="btn sec" onclick="document.getElementById('playerHash').value='';loadData()">全員表示</button>
    <span id="status" style="font-size:12px;color:var(--dim);margin-left:auto;"></span>
  </div>

  <div class="stats-row">
    <div class="stat-card"><h3>総ラウンド数</h3><div class="value" id="statTotal">—</div></div>
    <div class="stat-card"><h3>最多ラウンド</h3><div class="value" id="statTopRound" style="font-size:16px;padding-top:6px;">—</div><div class="sub" id="statTopCount"></div></div>
    <div class="stat-card"><h3>ユニークラウンド</h3><div class="value" id="statUnique">—</div></div>
    <div class="stat-card"><h3>記録期間</h3><div class="value" id="statPeriod" style="font-size:13px;padding-top:8px;">—</div></div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <h2>ラウンド分布</h2>
      <div class="chart-wrap">
        <canvas id="pieChart" width="220" height="220"></canvas>
        <div class="legend" id="pieLegend"></div>
      </div>
    </div>
    <div class="panel"><h2>テラー遭遇ランキング</h2><div class="bar-list" id="terrorBars"></div></div>
  </div>
  <div class="grid-2">
    <div class="panel"><h2>マップ別ラウンド数</h2><div class="bar-list" id="mapBars"></div></div>
    <div class="panel"><h2>ラウンド別詳細</h2><div class="bar-list" id="roundBars"></div></div>
  </div>

  <div id="loadingArea" class="loading"><div class="spinner"></div>データを読み込んでいます…</div>
</div>

<script>
const SB_URL="https://cpmosqeufhdknzwyfvio.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwbW9zcWV1Zmhka256d3lmdmlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDE2MDQsImV4cCI6MjA5NDYxNzYwNH0.k-EGeBWYZ6HexnK1o8jncneEK50Ff00qu5d5HGJCYSw";

const COLORS={
  "Classic":"#6495ED","Classic.exe":"#4169E1","Alternate":"#D8D8D8",
  "Midnight":"#8B0000","Bloodbath":"#FF2020","Bloodbath EX":"#FF4040",
  "Double Trouble":"#9370DB","Ghost":"#87CEEB","Fog":"#808080",
  "Punished":"#FFD700","Randomizer":"#FFD700","Sabotage":"#32CD32",
  "8 Pages":"#DEB887","Unbound":"#FF8C00","Cracked":"#FF6347",
  "Run":"#FF69B4","Mystic Moon":"#7B68EE","Blood Moon":"#DC143C",
  "Special":"#C0C0C0",
};
const colorFor=r=>{for(const[k,v]of Object.entries(COLORS))if(r.includes(k))return v;return"#555577";};

let terrors=null;

async function loadTerrors(){
  try{const res=await fetch("terrors.json");terrors=await res.json();}
  catch{terrors={classic:{},alternate:{},unbound:{}};}
}

function terrorName(id){
  if(!terrors)return`ID:${id}`;
  const s=String(id);
  return terrors.classic[s]||terrors.alternate[s]||`ID:${id}`;
}

async function fetchAll(hash) {
  let all = [];
  let offset = 0;
  const limit = 1000;
  while (true) {
    let url = `${SB_URL}/rest/v1/ToNRoundStatistics?select=*&order=date.desc,time.desc&limit=${limit}&offset=${offset}`;
    if (hash) url += `&player_id=eq.${hash}`;
    const res = await fetch(url, {
      headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
    });
    const rows = await res.json();
    all = all.concat(rows);
    if (rows.length < limit) break;
    offset += limit;
  }
  return all;
}

async function loadData(){
  const hash=document.getElementById("playerHash").value.trim();
  const la=document.getElementById("loadingArea");
  la.style.display="block";
  la.innerHTML='<div class="spinner"></div>データを読み込んでいます…';
  document.getElementById("status").textContent="取得中…";
  try{
    const rows=await fetchAll(hash||null);
    la.style.display="none";
    render(rows);
    document.getElementById("status").textContent=`${rows.length.toLocaleString()}件取得`;
  }catch(e){
    la.innerHTML=`<p style="color:#c44">エラー: ${e.message}</p>`;
    document.getElementById("status").textContent="エラー";
  }
}

function render(rows){
  if(!rows.length)return;
  document.getElementById("statTotal").textContent=rows.length.toLocaleString();
  document.getElementById("statUnique").textContent=new Set(rows.map(r=>r.round)).size;
  const dates=rows.map(r=>String(r.date)).sort();
  const fmt=d=>`${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)}`;
  document.getElementById("statPeriod").textContent=dates.length?`${fmt(dates[0])} 〜 ${fmt(dates[dates.length-1])}`:"—";
  const rc={};rows.forEach(r=>{rc[r.round]=(rc[r.round]||0)+1;});
  const top=Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("statTopRound").textContent=top?top[0]:"—";
  document.getElementById("statTopCount").textContent=top?`${top[1].toLocaleString()} rounds`:"";
  drawPie(rc);
  const tc={};
  rows.forEach(r=>{
    if(!r.terror_ids)return;
    const ids=Array.isArray(r.terror_ids)?r.terror_ids:[];
    ids.forEach(id=>{const n=terrorName(id);tc[n]=(tc[n]||0)+1;});
  });
  drawBars("terrorBars",tc,"#a07bd4");
  const mc={};
  rows.forEach(r=>{const k=r.map_id!=null?`Map ${r.map_id}`:"Unknown";mc[k]=(mc[k]||0)+1;});
  drawBars("mapBars",mc,"#4a9a8a");
  drawBars("roundBars",rc,"#c9a84c");
}

function drawPie(counts){
  const canvas=document.getElementById("pieChart");
  const ctx=canvas.getContext("2d");
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0);
  if(!total)return;
  const cx=W/2,cy=H/2,r=Math.min(W,H)/2-8,inner=r*.55;
  let angle=-Math.PI/2;
  entries.forEach(([name,count])=>{
    const slice=(count/total)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle,angle+slice);ctx.closePath();
    ctx.fillStyle=colorFor(name);ctx.fill();
    ctx.strokeStyle="#080810";ctx.lineWidth=1.5;ctx.stroke();
    angle+=slice;
  });
  ctx.beginPath();ctx.arc(cx,cy,inner,0,Math.PI*2);ctx.fillStyle="#0e0e1a";ctx.fill();
  ctx.fillStyle="#c9a84c";ctx.font='bold 24px Cinzel,serif';ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(total.toLocaleString(),cx,cy-8);
  ctx.font='10px Crimson Pro,serif';ctx.fillStyle="#50506a";ctx.fillText("ROUNDS",cx,cy+12);
  const legend=document.getElementById("pieLegend");legend.innerHTML="";
  entries.forEach(([name,count])=>{
    const pct=((count/total)*100).toFixed(1);
    const item=document.createElement("div");item.className="legend-item";
    item.innerHTML=`<span class="legend-dot" style="background:${colorFor(name)}"></span><span class="legend-name">${name}</span><span class="legend-count">${count.toLocaleString()}</span><span class="legend-pct">${pct}%</span>`;
    legend.appendChild(item);
  });
}

function drawBars(id,counts,color){
  const c=document.getElementById(id);c.innerHTML="";
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,30);
  const max=entries[0]?.[1]||1;
  entries.forEach(([name,count])=>{
    const pct=(count/max*100).toFixed(1);
    const item=document.createElement("div");item.className="bar-item";
    item.innerHTML=`<span class="bar-label" title="${name}">${name}</span><div class="bar-track"><div class="bar-fill" style="width:0%;background:${color}" data-w="${pct}"></div></div><span class="bar-count">${count.toLocaleString()}</span>`;
    c.appendChild(item);
  });
  requestAnimationFrame(()=>{c.querySelectorAll(".bar-fill").forEach(el=>{el.style.width=el.dataset.w+"%";});});
}

(async()=>{await loadTerrors();await loadData();})();
</script>
</body>
</html>
